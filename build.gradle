plugins {
    id "fabric-loom" version "1.14-SNAPSHOT"
    id "java"
}

group = "com.discordify"
version = "1.21.11"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"

    // ponytail: OkHttp replaces the hand-rolled TLS/HTTP parser; `include` embeds runtime jars in the mod.
    include(implementation("com.squareup.okhttp3:okhttp:4.12.0"))
    include(implementation("com.squareup.okio:okio:3.6.0"))
    include(implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.21"))
    include(implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.21"))
    include(implementation("org.jetbrains.kotlin:kotlin-stdlib-common:1.8.21"))
    include(implementation("org.jetbrains:annotations:13.0"))
    include(implementation("kr.devslab:ssrf-guard-core:3.3.0") {
        exclude group: "org.springframework.boot"
    })

    // ponytail: ImageIO plugin for signed CDN URLs that serve static WebP despite a .gif path.
    // Animated WebP is out of scope here; this plugin decodes static frames only.
    include(implementation("org.sejda.imageio:webp-imageio:0.1.6"))

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

loom {
    runs {
        client {
            property 'minecraft.window.width', '854'
            property 'minecraft.window.height', '480'
        }
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.named("jar") {
    manifest {
        attributes(
            "Fabric-Mod-ID": "discordify",
            "Fabric-Mod-Version": version,
            "Main-Class": "com.discordify.DiscordifyMod"
        )
    }
}