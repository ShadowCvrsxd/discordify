name: build

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: Test summary
        if: always()
        run: grep -h '<testsuite ' build/test-results/test/*.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestReports
          path: |
            **/build/test-results/
            **/build/reports/
