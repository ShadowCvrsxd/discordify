name: build

on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: Test summary
        if: always()
        run: grep -h '<testsuite ' build/test-results/test/*.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: Publish jar to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v0.1.0-alpha.1-mc1.21.11
          name: v0.1.0-alpha.1-mc1.21.11
          files: build/libs/discordify-0.1.0-alpha.1.jar
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestReports
          path: |
            **/build/test-results/
            **/build/reports/
